name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:crash-coverage
      - run: node --test tests/scripts/release_artifacts_test.mjs
      - run: npm run typecheck -w @rebelliocap/desktop
      - run: npm run lint -w @rebelliocap/desktop
      - run: npm run test -w @rebelliocap/desktop
      - run: npm run build -w @rebelliocap/desktop
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Browser acceptance
        run: npm run test:e2e -w @rebelliocap/desktop

  native-unit:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
          git --version
      - name: Bootstrap pinned vcpkg
        run: ./scripts/bootstrap-vcpkg.ps1
      - name: Configure
        run: ./scripts/invoke-dev.ps1 -Command @('cmake', '--preset', 'windows-debug')
      - name: Build
        run: ./scripts/invoke-dev.ps1 -Command @('cmake', '--build', '--preset', 'windows-debug')
      - name: C++ and script unit checks
        run: ./scripts/invoke-dev.ps1 -Command @('ctest', '--preset', 'windows-debug', '--output-on-failure')
      - name: Stage runtime for Rust compile
        run: ./scripts/stage-desktop-engine.ps1 -BuildDirectory build/windows-debug
      - name: Rust host checks
        run: ./scripts/invoke-dev.ps1 -Command @('cargo', 'test', '--locked', '--manifest-path', 'apps/desktop/src-tauri/Cargo.toml')
