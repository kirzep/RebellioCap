name: Windows installer release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.1.8)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    # Only the reviewed public export may produce distributed releases.
    if: github.repository == 'kirzep/RebellioCap'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
    steps:
      - name: Validate release tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Only stable vMAJOR.MINOR.PATCH release tags are supported.'
          }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Require signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Configure both updater signing Secrets in the public repository before building releases.'
          }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
      - run: npm ci
      - name: Validate desktop version
        run: node scripts/release-artifacts.mjs --tag $env:RELEASE_TAG --validate-only
      - run: node --test tests/scripts/release_artifacts_test.mjs
      - run: npm run test:crash-coverage
      - run: npm run test -w @rebelliocap/desktop
      # Cache package archives, not the installed tree; vcpkg checks each package ABI.
      - name: Restore native dependency cache
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/vcpkg
          key: windows-2025-x64-vcpkg-v1-${{ hashFiles('vcpkg*.json', 'scripts/bootstrap-vcpkg.ps1', 'third_party/vcpkg-ports/**', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            windows-2025-x64-vcpkg-v1-${{ hashFiles('vcpkg*.json', 'scripts/bootstrap-vcpkg.ps1', 'third_party/vcpkg-ports/**', 'cmake/**') }}-
            windows-2025-x64-vcpkg-v1-
      - name: Prepare native cache directory
        run: New-Item -ItemType Directory -Force -Path .cache/vcpkg | Out-Null
      - name: Bootstrap pinned native dependencies
        run: ./scripts/bootstrap-vcpkg.ps1
      - name: Build release engine
        run: |
          ./scripts/invoke-dev.ps1 -Command @('cmake', '--preset', 'windows-release')
          if ($LASTEXITCODE -ne 0) { throw 'Engine configure failed.' }
          ./scripts/invoke-dev.ps1 -Command @('cmake', '--build', '--preset', 'windows-release')
          if ($LASTEXITCODE -ne 0) { throw 'Engine build failed.' }
      # Save before later tests so a test failure does not discard expensive packages.
      - name: Save native dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/vcpkg
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Test engine
        run: ./scripts/invoke-dev.ps1 -Command @('ctest', '--preset', 'windows-release', '--output-on-failure')
      - name: Stage engine and runtime resources
        run: ./scripts/stage-desktop-engine.ps1 -BuildDirectory build/windows-release
      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target/debug/deps
            apps/desktop/src-tauri/target/debug/build
            apps/desktop/src-tauri/target/debug/.fingerprint
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/build
            apps/desktop/src-tauri/target/release/.fingerprint
          key: windows-2025-rust-1.98.1-release-v1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'vcpkg*.json', 'third_party/vcpkg-ports/**') }}-${{ github.sha }}
          restore-keys: |
            windows-2025-rust-1.98.1-release-v1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'vcpkg*.json', 'third_party/vcpkg-ports/**') }}-
            windows-2025-rust-1.98.1-release-v1-
      - name: Test Rust host
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --ci
      - name: Create update manifest and checksums
        run: |
          node scripts/release-artifacts.mjs --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ inputs.tag || github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'kirzep/RebellioCap'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kirzep/RebellioCap
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ inputs.tag || github.ref_name }}
          path: release
      - name: Create or refresh draft release
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace an already published release.' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "RebellioCap $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          $notes = gh release view $env:RELEASE_TAG --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read draft release notes.' }
          $manifestPath = Join-Path 'release' 'latest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.notes = $notes -join "`n"
          [IO.File]::WriteAllText([IO.Path]::GetFullPath($manifestPath), ($manifest | ConvertTo-Json -Depth 10) + "`n", [Text.UTF8Encoding]::new($false))
          $sums = @(Get-ChildItem -LiteralPath release -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          })
          [IO.File]::WriteAllText([IO.Path]::GetFullPath('release/SHA256SUMS'), ($sums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact upload failed.' }
      - name: Verify and publish release
        run: |
          node scripts/release-artifacts.mjs --tag $env:RELEASE_TAG --directory release --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

  mirror-private:
    # Reuse the public signed package instead of rebuilding or sharing credentials.
    if: github.repository == 'kirzep/ScopeClipper'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate mirrored version
        run: |
          node scripts/release-artifacts.mjs --tag $env:RELEASE_TAG --validate-only
          if ($LASTEXITCODE -ne 0) { throw 'Private source version does not match release tag.' }
      - name: Wait for public release
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(130)
          do {
            $info = gh release view $env:RELEASE_TAG --repo kirzep/RebellioCap --json isDraft,isPrerelease 2>$null
            if ($LASTEXITCODE -eq 0) {
              $release = $info | ConvertFrom-Json
              if (-not $release.isDraft -and -not $release.isPrerelease) { break }
            }
            $runs = gh run list --repo kirzep/RebellioCap --workflow desktop-release.yml --branch $env:RELEASE_TAG --limit 1 --json status,conclusion 2>$null
            if ($LASTEXITCODE -eq 0) {
              $latest = @($runs | ConvertFrom-Json)
              if ($latest.Count -gt 0 -and $latest[0].status -eq 'completed' -and
                  $latest[0].conclusion -in @('failure', 'cancelled', 'timed_out')) {
                throw 'The public release workflow failed; fix it before retrying the mirror.'
              }
            }
            if ([DateTime]::UtcNow -ge $deadline) { throw 'Timed out waiting for the published public release.' }
            Write-Host "Waiting for public release $env:RELEASE_TAG..."
            Start-Sleep -Seconds 30
          } while ($true)
      - name: Download and verify public artifacts
        run: |
          gh release download $env:RELEASE_TAG --repo kirzep/RebellioCap --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Public artifact download failed.' }
          node scripts/release-artifacts.mjs --tag $env:RELEASE_TAG --directory release --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Mirrored artifact verification failed.' }
      - name: Publish matching private release
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace an already published private release.' }
          } else {
            $notes = gh release view $env:RELEASE_TAG --repo kirzep/RebellioCap --json body --jq .body
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read public release notes.' }
            $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "RebellioCap $env:RELEASE_TAG" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Private draft release creation failed.' }
          }
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Private artifact upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Private release publication failed.' }
